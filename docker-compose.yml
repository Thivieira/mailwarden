version: "3.8"

services:
  mailwarden:
    build: .
    container_name: mailwarden
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - APP_BASE_URL=http://localhost:3000
      - MCP_BASE_URL=http://localhost:3000/mcp
      - DATABASE_URL=/app/data/mailwarden.db
      - AUTH_SECRET=mailwarden-dev-jwt-secret-at-least-32-chars-long!
      - CREDENTIAL_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - KEY_VERSION=v1
      - MAILBOX_MUTATIONS_ENABLED=false
    volumes:
      - ./data:/app/data

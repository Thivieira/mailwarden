name: Mailwarden CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        shell: bash
        run: |
          set +e
          OUTPUT=$(bun run typecheck 2>&1)
          STATUS=$?
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            while IFS= read -r LINE; do
              [ -n "$LINE" ] && printf '::error::%s\n' "$LINE"
            done <<< "$OUTPUT"
            exit "$STATUS"
          fi
      - name: Tests
        shell: bash
        run: |
          set +e
          OUTPUT=$(bun test 2>&1)
          STATUS=$?
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            while IFS= read -r LINE; do
              [ -n "$LINE" ] && printf '::error::%s\n' "$LINE"
            done <<< "$OUTPUT"
            exit "$STATUS"
          fi
